#: Keyboard shortcuts

#: Keys are identified simply by their lowercase Unicode characters.
#: For example: a for the A key, [ for the left square bracket key,
#: etc. For functional keys, such as Enter or Escape, the names are
#: present at Functional key definitions
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>.
#: For modifier keys, the names are ctrl (control, ⌃), shift (⇧), alt
#: (opt, option, ⌥), super (cmd, command, ⌘).

#: Simple shortcut mapping is done with the map directive. For full
#: details on advanced mapping including modal and per application
#: maps, see mapping <https://sw.kovidgoyal.net/kitty/mapping/>. Some
#: quick examples to illustrate common tasks::
#:     # unmap a keyboard shortcut, passing it to the program running in kitty
#:     map kitty_mod+space
#:     # completely ignore a keyboard event
#:     map ctrl+alt+f1 discard_event
#:     # combine multiple actions
#:     map kitty_mod+e combine : new_window : next_layout
#:     # multi-key shortcuts
#:     map ctrl+x>ctrl+y>z action
#: For non-Latin keyboard layouts (Russian, Arabic, etc.), the
#: --allow-fallback option controls physical key fallback. Values:
#: shifted (default — shifted key fallback), ascii (alternate key /
#: physical position fallback, only for non-ASCII keys), none (disable
#: all fallback), or a comma-separated combination. All default
#: shortcuts use --allow-fallback=shifted,ascii::
#:     map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard
#: You can browse and trigger these actions by pressing
#: command_palette to run the command palette. The full list of
#: actions that can be mapped to key presses is available here
#: <https://sw.kovidgoyal.net/kitty/actions/>.

kitty_mod ctrl+shift
#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.

clear_all_shortcuts yes

#: Remove all shortcut definitions up to this point. Useful, for
#: instance, to remove the default shortcuts.

map_timeout 0.0

#: The default timeout (in seconds) for multi-key mappings and modal
#: keyboard modes. If you press the first key(s) of a multi-key
#: mapping and don't press the next key within this timeout, the
#: mapping is cancelled and the mode is exited. A value of zero
#: disables the timeout. This can be overridden for specific modes
#: using the --timeout option when creating a keyboard mode with
#: --new-mode. For example::
#:     # 2 second timeout for all mappings
#:     map_timeout 2.0
#:     # This mode will have a 5 second timeout (overrides the global 2 second timeout)
#:     map --new-mode resize --timeout 5.0 kitty_mod+r

#: Clipboard {{{

#: Copy to clipboard
map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#::  There is also a copy_or_interrupt action that can be optionally
#::  mapped to Ctrl+C. It will copy only if there is a selection and
#::  send an interrupt otherwise. Similarly,
#::  copy_and_clear_or_interrupt will copy and clear the selection or
#::  send an interrupt if there is no selection. The copy_or_noop
#::  action will copy if there is a selection and pass the key through
#::  to the application running in the terminal if there is no
#::  selection.

#: Copy to clipboard or pass through

map --allow-fallback=shifted,ascii ctrl+c copy_or_noop

#: Paste from clipboard

map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard

#: }}}

#: Scrolling {{{

#: Scroll line up
map --allow-fallback=shifted,ascii kitty_mod+up                   scroll_line_up smooth

#: Scroll line down
map --allow-fallback=shifted,ascii kitty_mod+down                 scroll_line_down smooth

#: Scroll page up
map --allow-fallback=shifted,ascii kitty_mod+page_up scroll_page_up

#: Scroll page down
map --allow-fallback=shifted,ascii kitty_mod+page_down scroll_page_down

#: Scroll to bottom
map --allow-fallback=shifted,ascii kitty_mod+end scroll_end

#: Scroll to previous shell prompt
map --allow-fallback=shifted,ascii kitty_mod+home scroll_to_prompt -1

#::  Use a parameter of 0 for scroll_to_prompt to scroll to the last
#::  jumped to or the last clicked position. Requires shell
#::  integration <https://sw.kovidgoyal.net/kitty/shell-integration/>
#::  to work.


#: Browse scrollback buffer in pager
map --allow-fallback=shifted,ascii kitty_mod+space show_scrollback
#::  You can pipe the contents of the current screen and history
#::  buffer as STDIN to an arbitrary program using launch --stdin-
#::  source. For example, the following opens the scrollback buffer in
#::  less in an overlay window::
#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R
#::  For more details on piping screen and buffer contents to external
#::  programs, see launch <https://sw.kovidgoyal.net/kitty/launch/>.
#: Browse output of the last shell command in pager

#: Search the scrollback within a pager
map --allow-fallback=shifted,ascii kitty_mod+/                    search_scrollback
#::  Search for currently selected text in the scrollback using the
#::  configured scrollback_pager. Assumes that pressing the / key
#::  triggers search mode in the pager. If you want to create a manual
#::  mapping with a special pager for this, you can use something
#::  like:
#::      map f1 combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay mypager : send_key /
#::  For more sophisticated control, such as using the current
#::  selection, use remote_control_script.

#: }}}


#: Tab management {{{

#: Next tab
map --allow-fallback=shifted,ascii kitty_mod+right next_tab
map --allow-fallback=shifted,ascii kitty_mod+l next_tab
map --allow-fallback=shifted,ascii ctrl+tab        next_tab

#: Previous tab
map --allow-fallback=shifted,ascii kitty_mod+left previous_tab
map --allow-fallback=shifted,ascii kitty_mod+h previous_tab
map --allow-fallback=shifted,ascii ctrl+shift+tab previous_tab

#: New tab
map --allow-fallback=shifted,ascii kitty_mod+t new_tab

#: Move tab forward
map --allow-fallback=shifted,ascii kitty_mod+] move_tab_forward
map --allow-fallback=shifted,ascii kitty_mod+k move_tab_forward

#: Move tab backward
map --allow-fallback=shifted,ascii kitty_mod+[ move_tab_backward
map --allow-fallback=shifted,ascii kitty_mod+j move_tab_backward

#: Font sizes {{{

#: You can change the font size for all top-level kitty OS windows at
#: a time or only the current one.

#: Increase font size
map kitty_mod+equal  change_font_size all +2.0
map kitty_mod+plus   change_font_size all +2.0
map kitty_mod+kp_add change_font_size all +2.0

#: Decrease font size
map --allow-fallback=shifted,ascii kitty_mod+minus       change_font_size all -2.0
map --allow-fallback=shifted,ascii kitty_mod+kp_subtract change_font_size all -2.0

#: Reset font size
map --allow-fallback=shifted,ascii kitty_mod+backspace change_font_size all 0
map --allow-fallback=shifted,ascii kitty_mod+0 change_font_size all 0

#: }}}

#: Miscellaneous {{{

#: Show documentation
map --allow-fallback=shifted,ascii kitty_mod+f1 show_kitty_doc overview

#: Command palette
map --allow-fallback=shifted,ascii kitty_mod+f3 command_palette

#: Unicode input
map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input
# map ctrl+cmd+space                 kitten unicode_input

#: Edit config file
map --allow-fallback=shifted,ascii kitty_mod+, edit_config_file

#: Reset the terminal
map --allow-fallback=shifted,ascii kitty_mod+delete clear_terminal reset active

#::  You can create shortcuts to clear/reset the terminal. For
#::  example::
#::      # Reset the terminal
#::      map f1 clear_terminal reset active
#::      # Clear the terminal screen by erasing all contents
#::      map f1 clear_terminal clear active
#::      # Clear the terminal scrollback by erasing it
#::      map f1 clear_terminal scrollback active
#::      # Scroll the contents of the screen into the scrollback
#::      map f1 clear_terminal scroll active
#::      # Clear everything on screen up to the line with the cursor or the start of the current prompt (needs shell integration)
#::      map f1 clear_terminal to_cursor active
#::      # Same as above except cleared lines are moved into scrollback
#::      map f1 clear_terminal to_cursor_scroll active
#::      # Erase the last command and its output (needs shell integration to work)
#::      map f1 clear_terminal last_command active

#: Reload kitty.conf
map kitty_mod+f5 load_config_file
#::  Reload kitty.conf, applying any changes since the last time it
#::  was loaded. Note that a handful of options cannot be dynamically
#::  changed and require a full restart of kitty. Particularly, when
#::  changing shortcuts for actions located on the macOS global menu
#::  bar, a full restart is needed. You can also map a keybinding to
#::  load a different config file, for example::
#::      map f5 load_config /path/to/alternative/kitty.conf
#::  Note that all options from the original kitty.conf are discarded,
#::  in other words the new configuration *replace* the old ones.

#: Debug kitty configuration
map kitty_mod+f6 debug_config
#::  Show details about exactly what configuration kitty is running
#::  with and its host environment. Useful for debugging issues.

#: }}}
