background{
  path=screenshot
  blur_passes=4
  blur_size=3
}

$fn_greet=echo "<i> Hi $USER :) </i>"
$wall = /home/mahaveer/.config/hyprlock/wallpapers/4.jpg

# GENERAL
general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = $p1_accent_4_rgba
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 70
    position = 0, -10
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%d %b %A"
    # color = rgba(255, 255, 255, 1)
    color = $p3_accent_6_rgba
    font_size = 14
    halign = center
    valign = top
    position = 0,-125
    zindex = 5
}

# INPUT FIELD
input-field {
    monitor =
    size = 100,100
    outline_thickness = 15
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    dots_size = 0.5 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = $primary_7_rgba
    font_color = rgba(200, 0, 0, 0.5)
    fade_on_empty = false
    # placeholder_text = <i>Login $USER </i>
    placeholder_text =
    # invert_numlock = true # change color if numlock is off
    # capslock_color = 1
    # numlock_color = 1
    # bothlock_color = 1 
    hide_input = true
    halign = center
    valign = center
    position = 0,-200
    zindex = 20
}
