palette="matugen"

"$schema" = "https://starship.rs/config-schema.json"
format="""
[╭─](fg:primary)[ $username ](fg:on_primary bg:primary)[](fg:primary bg:primary_fixed)\
[ $directory ](fg:on_primary_fixed bg:primary_fixed)[$git_branch](fg:primary bg:primary_fixed)[](fg:primary_fixed bg:primary_container)\
[ $jobs](bg:primary_container fg:primary)\
$fill\
[](bg:primary_container fg:base00)[$status](bg:base00 fg:primary bold)\
[ $cmd_duration ](bg:base00 fg:base03)\
[](bg:base00 fg:primary)[ $hostname ](fg:on_primary bg:primary)[](fg:primary)\
$line_break\
[╰───](fg:primary)$character
"""

right_format = "[$time](fg:primary)"
continuation_prompt = "$character"
scan_timeout = 30
command_timeout = 500
add_newline = true
follow_symlinks = true
#       
#
[palettes.matugen]
<* for name, value in colors *>
{{ name }} = "{{ value.default.hex }}"
<* endfor *>
<* for name, value in base16 *>
{{ name }} = "{{ value.default.hex }}"
<* endfor *>

[profiles]

[character]
format = "$symbol"
success_symbol = "[ 󱐋 ]( primary)"
error_symbol = "[ 󱐋 ]( tertiary)"
vimcmd_symbol = "[ 󱐋 ]( green)"
vimcmd_visual_symbol = "[󱐋](bold yellow)"
vimcmd_replace_symbol = "[󱐋](bold purple)"
vimcmd_replace_one_symbol = "[󱐋](bold purple)"
disabled = false

[cmd_duration]
min_time = 0
format = " $duration"
show_milliseconds = true
disabled = false
show_notifications = false

[directory]
truncation_length = 5
truncate_to_repo = true
fish_style_pwd_dir_length = 0
use_logical_path = false
format = "󰉋 $read_only$path"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
disabled = false
read_only = "󰌾 "
read_only_style = "red"
truncation_symbol = "…"
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]

[fill]
symbol = " "
style = "bg:primary_container"

[git_branch]
symbol=''
format='$symbol$branch'

[hostname]
ssh_only = false
trim_at = "."
format = "󰌢 $ssh_symbol$hostname"
ssh_symbol = "[ssh:](italic bg:primary fg:primary_container)"
disabled = false

[hostname.aliases]

[jobs]
threshold = 1
symbol_threshold = 1
number_threshold = 2
format = "j$number"
disabled = false

[line_break]
disabled = false

[shell]
disabled = true

[shlvl]
threshold = 2
format = "[+](#af5f00)[$shlvl](#ffff00) "
repeat = false
repeat_offset = 0
disabled = true

[status]
format = " $status"
map_symbol = false
recognize_signal_code = true
pipestatus = false
pipestatus_separator = "|"
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style) '
disabled = false

[time]
format = "$time"
use_12hr = false
disabled = false
utc_time_offset = "local"
time_range = "-"

[username]
detect_env_vars = []
format = " $user"
show_always = true
disabled = false

[username.aliases]

[custom]

